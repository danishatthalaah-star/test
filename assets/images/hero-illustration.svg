<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#1E293B" flood-opacity="0.08" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background blobs -->
  <circle cx="480" cy="110" r="100" fill="#E0F2FE" opacity="0.7" />
  <circle cx="120" cy="340" r="90" fill="#F3E8FF" opacity="0.6" />
  <ellipse cx="320" cy="380" rx="220" ry="25" fill="#E2E8F0" opacity="0.6" />

  <!-- Main browser / window mockup -->
  <g filter="url(#shadow)">
    <rect x="90" y="80" width="420" height="270" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <!-- Window header bar -->
    <path d="M 90 96 A 16 16 0 0 1 106 80 L 494 80 A 16 16 0 0 1 510 96 L 510 115 L 90 115 Z" fill="#F8FAFC" />
    <circle cx="115" cy="98" r="5" fill="#EF4444" />
    <circle cx="132" cy="98" r="5" fill="#F59E0B" />
    <circle cx="149" cy="98" r="5" fill="#10B981" />
    <!-- Address bar pill -->
    <rect x="175" y="90" width="180" height="15" rx="7.5" fill="#EDF2F7" />
    <circle cx="185" cy="97.5" r="3" fill="#94A3B8" />
    <rect x="195" y="95" width="80" height="5" rx="2.5" fill="#CBD5E1" />

    <!-- Window inner canvas -->
    <!-- Hero block inside screen -->
    <rect x="115" y="135" width="170" height="14" rx="4" fill="url(#primaryGrad)" />
    <rect x="115" y="158" width="130" height="8" rx="4" fill="#94A3B8" />
    <rect x="115" y="172" width="150" height="8" rx="4" fill="#CBD5E1" />
    <rect x="115" y="195" width="70" height="22" rx="6" fill="url(#accentGrad)" />

    <!-- Code Editor Mini-Card inside window -->
    <rect x="300" y="135" width="185" height="130" rx="10" fill="#0F172A" />
    <circle cx="316" cy="149" r="3.5" fill="#EF4444" />
    <circle cx="327" cy="149" r="3.5" fill="#F59E0B" />
    <circle cx="338" cy="149" r="3.5" fill="#10B981" />
    <!-- Code lines -->
    <rect x="316" y="165" width="60" height="5" rx="2.5" fill="#38BDF8" />
    <rect x="382" y="165" width="45" height="5" rx="2.5" fill="#A855F7" />
    <rect x="328" y="178" width="90" height="5" rx="2.5" fill="#34D399" />
    <rect x="328" y="191" width="75" height="5" rx="2.5" fill="#F472B6" />
    <rect x="328" y="204" width="110" height="5" rx="2.5" fill="#FBBF24" />
    <rect x="316" y="217" width="40" height="5" rx="2.5" fill="#38BDF8" />
    <rect x="316" y="240" width="85" height="12" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="324" y="249" font-family="monospace" font-size="7" fill="#38BDF8">&lt;Ready/&gt;</text>

    <!-- Bottom dashboard columns -->
    <rect x="115" y="235" width="50" height="90" rx="8" fill="#F1F5F9" />
    <rect x="125" y="285" width="30" height="30" rx="4" fill="#3B82F6" opacity="0.8" />
    <rect x="175" y="235" width="50" height="90" rx="8" fill="#F1F5F9" />
    <rect x="185" y="260" width="30" height="55" rx="4" fill="#10B981" opacity="0.8" />
    <rect x="235" y="235" width="50" height="90" rx="8" fill="#F1F5F9" />
    <rect x="245" y="245" width="30" height="70" rx="4" fill="#6366F1" opacity="0.8" />
  </g>

  <!-- Floating Feature Badges around -->
  <!-- Floating Card 1: Fast Performance (Top Left) -->
  <g filter="url(#shadow)">
    <rect x="45" y="140" width="115" height="55" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="72" cy="167" r="16" fill="#FEF3C7" />
    <path d="M 72 158 L 66 168 L 71 168 L 70 176 L 78 165 L 73 165 Z" fill="#F59E0B" />
    <rect x="96" y="158" width="50" height="7" rx="3.5" fill="#1E293B" />
    <rect x="96" y="170" width="35" height="5" rx="2.5" fill="#94A3B8" />
  </g>

  <!-- Floating Card 2: Interactive JavaScript (Bottom Right) -->
  <g filter="url(#shadow)">
    <rect x="440" y="260" width="125" height="60" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="468" cy="290" r="16" fill="#FDF08A" />
    <text x="461" y="296" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" fill="#854D0E">JS</text>
    <rect x="492" y="280" width="60" height="7" rx="3.5" fill="#1E293B" />
    <rect x="492" y="292" width="45" height="5" rx="2.5" fill="#10B981" />
  </g>

  <!-- Floating Card 3: Responsive UI (Top Right) -->
  <g filter="url(#shadow)">
    <rect x="420" y="55" width="135" height="50" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="445" cy="80" r="14" fill="#EFF6FF" />
    <rect x="439" y="72" width="12" height="16" rx="2" fill="none" stroke="#3B82F6" stroke-width="2" />
    <circle cx="445" cy="84" r="1" fill="#3B82F6" />
    <rect x="468" y="72" width="70" height="7" rx="3.5" fill="#1E293B" />
    <rect x="468" y="84" width="45" height="5" rx="2.5" fill="#64748B" />
  </g>

  <!-- Decorative sparkles and circles -->
  <circle cx="160" cy="50" r="4" fill="#3B82F6" />
  <circle cx="80" cy="270" r="6" fill="#A855F7" opacity="0.6" />
  <circle cx="530" cy="180" r="5" fill="#10B981" opacity="0.7" />
  <circle cx="380" cy="385" r="5" fill="#F43F5E" opacity="0.7" />
</svg>
