<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="shirtGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <clipPath id="avatarClip2">
      <circle cx="150" cy="150" r="140" />
    </clipPath>
  </defs>

  <!-- Circular Base -->
  <circle cx="150" cy="150" r="145" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="6" />
  
  <g clip-path="url(#avatarClip2)">
    <!-- Background Circle Fill -->
    <rect x="0" y="0" width="300" height="300" fill="url(#avatarBg2)" />
    <circle cx="60" cy="80" r="60" fill="#F59E0B" opacity="0.2" />

    <!-- Body / Shoulders -->
    <path d="M 50 310 C 60 230 110 215 150 215 C 190 215 240 230 250 310 Z" fill="url(#shirtGrad2)" />
    <!-- Collar & necklace detail -->
    <polygon points="150,228 135,215 165,215" fill="#FFFFFF" />
    <circle cx="150" cy="225" r="4" fill="#F59E0B" />

    <!-- Neck -->
    <rect x="136" y="170" width="28" height="35" rx="6" fill="#FED7AA" />

    <!-- Head / Face -->
    <ellipse cx="150" cy="140" rx="40" ry="46" fill="#FFEDD5" />

    <!-- Hair (Stylish side sweep / modern cut) -->
    <path d="M 100 135 C 95 90 125 70 150 70 C 180 70 200 88 198 130 C 195 105 180 90 150 90 C 120 90 110 115 100 135 Z" fill="#475569" />
    <path d="M 102 125 C 100 160 108 175 112 180 C 112 155 110 135 115 125 Z" fill="#475569" />

    <!-- Ears & Earrings -->
    <circle cx="108" cy="142" r="7" fill="#FFEDD5" />
    <circle cx="192" cy="142" r="7" fill="#FFEDD5" />
    <circle cx="108" cy="151" r="3" fill="#F59E0B" />
    <circle cx="192" cy="151" r="3" fill="#F59E0B" />

    <!-- Eyebrows -->
    <path d="M 126 122 Q 135 118 143 122" stroke="#334155" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <path d="M 157 122 Q 165 118 174 122" stroke="#334155" stroke-width="2.2" stroke-linecap="round" fill="none" />

    <!-- Eyes -->
    <circle cx="135" cy="132" r="4" fill="#1E293B" />
    <circle cx="165" cy="132" r="4" fill="#1E293B" />
    <circle cx="136" cy="130" r="1.5" fill="#FFFFFF" />
    <circle cx="166" cy="130" r="1.5" fill="#FFFFFF" />

    <!-- Nose -->
    <path d="M 150 135 L 148 145 L 152 145" stroke="#EA580C" stroke-width="1.8" stroke-linecap="round" fill="none" />

    <!-- Warm Smile -->
    <path d="M 140 157 Q 150 167 160 157" stroke="#C2410C" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>
</svg>
